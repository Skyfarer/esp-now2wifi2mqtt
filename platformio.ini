; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Common settings for both environments
[common]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
upload_speed = 460800  ; Reduced from 921600 for more reliable uploads
monitor_filters = esp8266_exception_decoder

; ESP-NOW to Serial Bridge (no WiFi connection)
[env:espnow-bridge]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
upload_speed = ${common.upload_speed}
monitor_filters = ${common.monitor_filters}
build_src_filter = +<espnow_bridge.cpp>

; ESP-NOW to WiFi/MQTT Bridge
[env:wifi-bridge]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
upload_speed = ${common.upload_speed}
monitor_filters = ${common.monitor_filters}
build_src_filter = +<wifi_bridge.cpp>
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^6.21.3
build_flags =
    -D MQTT_MAX_PACKET_SIZE=512
    -D MQTT_KEEPALIVE=30